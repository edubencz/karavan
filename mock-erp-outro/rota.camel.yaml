- route:
    id: route-1297
    description: Gravar movimentacao
    from:
      id: from-719d
      description: Gravar movimentacao
      uri: direct
      parameters:
        name: gravar-movimentacao
      steps:
        - unmarshal:
            id: unmarshal-fc74
            json:
              id: json-ff61
              library: Jackson
        - setBody:
            id: setBody-0e11
            expression:
              simple:
                id: simple-6831
                expression: "INSERT INTO movimentacao (id, descricao, valor,origem, destino, status) VALUES (\r\n'${exchangeId}',\r\n'${body[descricao]}',\r\n${body[valor]},\r\n'${body[origem]}',\r\n'${body[destino]}',\r\n'${body[status]}')"
        - to:
            id: to-9c7d
            uri: jdbc
            parameters:
              dataSourceName: datasource
        - setHeader:
            id: setHeader-c6d3
            name: Content-type
            expression:
              constant:
                id: constant-1040
                expression: application/json
        - setBody:
            id: setBody-a7d3
            expression:
              constant:
                id: constant-851d
                expression: >
                  {"status": "sucesso", "mensagem": "Movimentação inserida com
                  sucesso"}
- route:
    id: route-1292
    description: access_db
    from:
      id: from-7191
      uri: direct
      parameters:
        name: access_db
      steps:
        - to:
            id: to-c398
            uri: direct
            parameters:
              name: auth
        - toD:
            id: to-2324
            disabled: false
            uri: sql
            parameters:
              query: ${exchangeProperty.sql_command}
              dataSource: "#bean:dataSource"
        - marshal:
            id: marshal-ca05
            jacksonXml:
              id: jacksonXml-d1f9
- route:
    id: route-7f61
    description: Auth
    nodePrefixId: route-6f9
    from:
      id: from-d3a6
      uri: direct
      parameters:
        name: auth
      steps:
        - log:
            id: log-cfc5
            message: ${body}
        - choice:
            id: choice-9e05
            when:
              - id: when-c54b
                expression:
                  simple:
                    id: simple-0501
                    expression: ${header.Authorization} == 'Bearer mocked-token-12345'
            otherwise:
              id: otherwise-2203
              steps:
                - setHeader:
                    id: setHeader-c4ea
                    name: CamelHttpResponseCode
                    expression:
                      constant:
                        id: constant-7123
                        expression: "401"
                - setHeader:
                    id: setHeader-dca8
                    name: Content-type
                    expression:
                      constant:
                        id: constant-6af8
                        expression: application/json
                - setBody:
                    id: setBody-ed8b
                    expression:
                      constant:
                        id: constant-7e80
                        expression: |2-
                                              {
                                                "error": "invalid_token",
                                                "error_description": "Token inválido ou ausente"
                                              }
                - stop:
                    id: stop-89b6
