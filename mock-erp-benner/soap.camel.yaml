- route:
    id: route-7f61
    nodePrefixId: route-6f9
    from:
      id: from-d3a6
      uri: direct
      parameters:
        name: auth
      steps:
        - choice:
            id: choice-9e05
            when:
              - id: when-c54b
                expression:
                  simple:
                    id: simple-0501
                    expression: ${header.Authorization} == 'Bearer mocked-token-12345'
            otherwise:
              id: otherwise-2203
              steps:
                - setBody:
                    id: setBody-ed8b
                    expression:
                      constant:
                        id: constant-7e80
                        expression: >-
                          <soap:Fault
                          xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><faultcode>soap:Client</faultcode><faultstring>Authorization
                          header is missing</faultstring></soap:Fault>
                - stop:
                    id: stop-89b6
