- route:
    id: route-4fb4
    description: Financeiro
    from:
      id: from-32bf
      uri: cxf
      parameters:
        address: http://0.0.0.0:8080/financeiro
        wsdlURL: financeiro.wsdl
        dataFormat: PAYLOAD
        loggingFeatureEnabled: true
        serviceName: >-
          {http://Benner.Corporativo.WebServices.DataContracts/2010/10}FinanceiroService
        endpointName: >-
          {http://Benner.Corporativo.WebServices.DataContracts/2010/10}FinanceiroServiceSoap
      steps:
        - to:
            id: to-be62
            uri: direct
            parameters:
              name: auth
        - choice:
            id: choice-0953
            when:
              - id: when-39e7
                expression:
                  simple:
                    id: simple-5210
                    expression: ${header.Teste} == "teste"
                steps:
                  - choice:
                      id: choice-c915
                      when:
                        - id: when-a76d
                          expression:
                            xpath:
                              id: xpath-cace
                              expression: //web:AtributoNovoObrigatorio
                              namespace:
                                - key: web
                                  value: >-
                                    http://Benner.Corporativo.WebServices.DataContracts/2010/10
                          steps:
                            - log:
                                id: log-e9e0
                                message: Tudo certo com payload obrigatorio
                      otherwise:
                        id: otherwise-f42a
                        steps:
                          - log:
                              id: log-84c5
                              message: Payload obrigatorio ERRADO
                          - setBody:
                              id: setBody-edf3
                              expression:
                                constant:
                                  id: constant-0b89
                                  expression: >-
                                    <soap:Fault
                                    xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><faultcode>soap:Client</faultcode><faultstring>Campo
                                    obrigatorio
                                    inexistente</faultstring></soap:Fault>
            otherwise:
              id: otherwise-9a18
              steps:
                - log:
                    id: log-acc5
                    message: Sem header, caminho default
        - log:
            id: log-e2ad
            message: ${body}
