                            - toD:
                                id: to-e193
                                description: Chama erp
                                uri: http
                                parameters:
                                  httpMethod: POST
                                  logHttpActivity: true
                                  bridgeEndpoint: true
                                  httpUri: host.docker.internal:8088/financeiro
                      otherwise:
                        id: otherwise-ef6c
                        description: Precisa transform
                        steps:
                          - log:
                              id: log-e599
                              message: Body sem sucesso, necessario transformar
                              loggingLevel: WARN
                          - setBody:
                              id: setBody-9fa1
                              expression:
                                constant:
                                  id: constant-86e4
                                  expression: "<soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\r\n    <soap:Body>\r\n        <web:Integrar xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:web=\"http://Benner.Corporativo.WebServices.DataContracts/2010/10\">\r\n            <web:request>\r\n                <web:Identificador>ID-REQUISICAO-123</web:Identificador>\r\n                <web:Documentos>\r\n                    <web:DocumentoLayout>\r\n                        <web:Campos>\r\n                            <web:CampoLayout>\r\n                                <web:Nome>TipoDocumento</web:Nome>\r\n                                <web:Valor>NF</web:Valor>\r\n                            </web:CampoLayout>\r\n                            <web:CampoLayout>\r\n                                <web:Nome>ValorTotal</web:Nome>\r\n                                <web:Valor>1500.00</web:Valor>\r\n                            </web:CampoLayout>\r\n                        </web:Campos>\r\n                        <web:Identificador>DOC-001</web:Identificador>\r\n                        <web:DeveDesbloquearAposInclusao>true</web:DeveDesbloquearAposInclusao>\r\n                    </web:DocumentoLayout>\r\n                </web:Documentos>\r\n                <web:PodeExecutarParcial>true</web:PodeExecutarParcial>\r\n            </web:request>\r\n        </web:Integrar>\r\n    </soap:Body>\r\n</soap:Envelope>"
                          - toD:
                              id: toD-4383
