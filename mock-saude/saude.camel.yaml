- route:
    id: route-a3b8
    nodePrefixId: route-a0f
    from:
      id: from-983d
      uri: cxf
      parameters:
        address: http://0.0.0.0:8080/saude
        dataFormat: PAYLOAD
        loggingFeatureEnabled: true
        wsdlURL: saude.wsdl
        serviceName: >-
          {http://Benner.Saude.Service.IntegracaoFinanceira.DataContracts/2011/01}IntegracaoFinanceiraService
        endpointName: >-
          {http://Benner.Saude.Service.IntegracaoFinanceira.DataContracts/2011/01}IntegracaoFinanceiraServiceSoap
      steps:
        - to:
            id: to-5463
            uri: direct
            parameters:
              name: auth
        - choice:
            id: choice-92fe
            when:
              - id: when-a475
                expression:
                  simple:
                    id: simple-7d08
                    expression: >-
                      ${header.SOAPAction} ==
                      "http://Benner.Saude.Service.IntegracaoFinanceira.DataContracts/2011/01/TestPost"
                steps:
                  - removeHeaders:
                      id: removeHeaders-cd99
                      pattern: "*"
                  - setHeader:
                      id: setHeader-601c
                      name: Authorization
                      expression:
                        constant:
                          id: constant-5c88
                          expression: Bearer mocked-token-12345
                  - setBody:
                      id: setBody-800d
                      expression:
                        constant:
                          id: constant-24b0
                          expression: "<soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\r\n    <soap:Body>\r\n        <web:Integrar xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:web=\"http://Benner.Corporativo.WebServices.DataContracts/2010/10\">\r\n            <web:request>\r\n                <web:Identificador>ID-REQUISICAO-123</web:Identificador>\r\n                <web:Documentos>\r\n                    <web:DocumentoLayout>\r\n                        <web:Campos>\r\n                            <web:CampoLayout>\r\n                                <web:Nome>TipoDocumento</web:Nome>\r\n                                <web:Valor>NF</web:Valor>\r\n                            </web:CampoLayout>\r\n                            <web:CampoLayout>\r\n                                <web:Nome>ValorTotal</web:Nome>\r\n                                <web:Valor>1500.00</web:Valor>\r\n                                <web:QQR>1500.00</web:QQR>\r\n                            </web:CampoLayout>\r\n                        </web:Campos>\r\n                        <web:Identificador>DOC-001</web:Identificador>\r\n                        <web:DeveDesbloquearAposInclusao>true</web:DeveDesbloquearAposInclusao>\r\n                    </web:DocumentoLayout>\r\n                </web:Documentos>\r\n                <web:PodeExecutarParcial>true</web:PodeExecutarParcial>\r\n            </web:request>\r\n        </web:Integrar>\r\n    </soap:Body>\r\n</soap:Envelope>"
                  - toD:
                      id: to-e193
                      uri: http
                      parameters:
                        httpMethod: POST
                        logHttpActivity: true
                        bridgeEndpoint: true
                        httpUri: host.docker.internal:8088/financeiro
            otherwise:
              id: otherwise-e19b
        - log:
            id: log-6ebd
            message: ${body}
- route:
    id: route-7f61
    nodePrefixId: route-6f9
    from:
      id: from-d3a6
      uri: direct
      parameters:
        name: auth
      steps:
        - choice:
            id: choice-9e05
            when:
              - id: when-c54b
                expression:
                  simple:
                    id: simple-0501
                    expression: ${header.Authorization} == 'Bearer mocked-token-12345'
            otherwise:
              id: otherwise-2203
              steps:
                - setBody:
                    id: setBody-ed8b
                    expression:
                      constant:
                        id: constant-7e80
                        expression: >-
                          <soap:Fault
                          xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><faultcode>soap:Client</faultcode><faultstring>Authorization
                          header is missing</faultstring></soap:Fault>
                - stop:
                    id: stop-89b6
