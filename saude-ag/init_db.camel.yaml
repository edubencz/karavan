- beans:
    - name: dataSource
      type: org.h2.jdbcx.JdbcDataSource
      properties:
        uRL: jdbc:h2:mem:mockdb;DB_CLOSE_DELAY=-1
        user: sa
        password: ""
- route:
    id: route-08bc
    description: init db
    nodePrefixId: route-d2f
    from:
      id: from-8a2e
      description: initialize
      uri: timer
      parameters:
        repeatCount: "1"
        timerName: init_db
      steps:
        - to:
            id: to-522e
            description: inject data
            uri: sql
            parameters:
              dataSource: "#bean:dataSource"
              query: file:db.sql
